<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>裕信售後營運儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="主選單">

      <div class="brand-t">裕信汽車 服務部</div>
      <div class="brand-s">售後 CRM／客戶經營儀表板</div>

    <div class="side-foot" id="sideFoot"></div>

  <div class="main-col">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="開關選單" aria-controls="side">☰</button>
      <div class="top-title" id="topTitle">營運總表</div>
      <div class="top-meta" id="topMeta">資料基準日 —</div>
      <div class="top-scope">
        <label for="brSel">服務廠</label>
        <select id="brSel"></select>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>

<div class="tip" id="tip" hidden></div>
<script src="data/data.js"></script>
<script src="js/app.js"></script>
